<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pop Quiz</title>
    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body>
    <div class="quiz-container">
      <h1 class="quiz-title">Pop Quiz!</h1>
      <p class="quiz-question" id="question">Question will appear here</p>
      <ul class="quiz-answers" id="answers">
        <!-- Answers will be inserted here by JS -->
      </ul>
      <div class="timer">Time left: <span id="timer">10</span>s</div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
